name: Daily upstream sync

on:
  schedule:
    # 每天北京时间 03:00（GitHub Actions 使用 UTC，这里是前一天 19:00 UTC）
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install --upgrade pytest

      - name: Run tests
        run: python -m pytest

      - name: Sync and transform upstream content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/sync_transform.py --config config/config.json

      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- data/)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: sync upstream content"
          git push
